# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
jobs:
  eigen-exception-policy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake clang-19 libgtest-dev libeigen3-dev
    - name: Configure exception-aware Eigen tasks
      run: >
        cmake -S . -B build-exception-policy -DCMAKE_CXX_COMPILER=clang++-19
        -DOOX_BUILD_TESTS=ON -DOOX_BUILD_BENCHMARKS=OFF
        -DOOX_ENABLE_EIGEN=ON -DOOX_EIGEN_THREADS=2 -DOOX_EXCEPTIONS_ENABLED=ON
        -DOOX_ENABLE_TBB=OFF -DOOX_ENABLE_TF=OFF -DOOX_ENABLE_FOLLY=OFF -DOOX_ENABLE_OMP=OFF
    - name: Build exception and pool tests
      run: cmake --build build-exception-policy --target test_oox_eigen eigen_pool_test -j 8
    - name: Verify propagation and fail-fast boundary
      run: >
        ctest --test-dir build-exception-policy --output-on-failure --timeout 120
        -R '^(OOX_EIGEN[.]|EigenPool[.]|EigenPoolDeathTest[.])'

  papi-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: PAPI build dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake clang-19 libbenchmark-dev libpapi-dev
    - name: Configure real PAPI integration
      run: >
        cmake -S . -B build-papi -DCMAKE_CXX_COMPILER=clang++-19
        -DOOX_BUILD_TESTS=OFF -DOOX_BUILD_BENCHMARKS=ON
        -DOOX_BUILD_TASKBENCH=OFF -DOOX_BUILD_SCHEDULER_EVALS=ON
        -DOOX_SCHEDULER_EVAL_PAPI=ON -DOOX_ENABLE_TBB=OFF
        -DOOX_ENABLE_TF=OFF -DOOX_ENABLE_FOLLY=OFF -DOOX_ENABLE_OMP=OFF
    - name: Compile against PAPI
      run: cmake --build build-papi --target scheduler_eval_all -j 8
    - name: Validate accounting without hardware measurements
      run: ctest --test-dir build-papi -R scheduler_eval_papi_lifecycle --output-on-failure

  pbbs-applications:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: oox
            mode: EIGEN_STEALING
          - backend: oox-tasks
            mode: OOX_TASKS
          - backend: serial
            mode: SERIAL
    steps:
    - uses: actions/checkout@v5
    - name: Dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake clang-19 libjemalloc-dev
    - name: Verify vendored PBBS sources
      run: |
        python3 benchmarks/pbbs/tests_snapshot.py
        python3 benchmarks/pbbs/tests_processes.py
    - name: Acquire checksum-verified original data (no code checkout)
      run: >
        python3 benchmarks/scheduler_eval/tools/datasets.py --archives-only --bundled
    - name: Compile and run checker-backed application suite
      timeout-minutes: 35
      run: >
        python3 benchmarks/pbbs/run.py --ci-smoke --timeout 900
        --output cmake-build-pbbs/ci-smoke-results
        --backend ${{ matrix.backend }} --mode ${{ matrix.mode }} --threads 2
        --compiler clang++-19

  scheduler-eval:
    runs-on: ubuntu-latest
    env:
      BENCH_NUM_THREADS: "2"
    strategy:
      fail-fast: false
      matrix:
        external-backends: ["OFF", "ON"]
    steps:
    - uses: actions/checkout@v5
    - name: Dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake clang-19 libbenchmark-dev libtbb-dev libomp-19-dev
    - name: Configure scheduler evaluations
      run: >
        cmake -S . -B build-scheduler-eval
        -DCMAKE_CXX_COMPILER=clang++-19
        -DOOX_BUILD_TESTS=OFF -DOOX_BUILD_BENCHMARKS=ON
        -DOOX_BUILD_TASKBENCH=OFF -DOOX_BUILD_SCHEDULER_EVALS=ON
        -DOOX_ENABLE_TBB=${{ matrix.external-backends }} -DOOX_ENABLE_TF=OFF
        -DOOX_ENABLE_FOLLY=OFF -DOOX_ENABLE_OMP=${{ matrix.external-backends }}
        -DOOX_EIGEN_THREADS=2
    - name: Build scheduler evaluations
      run: cmake --build build-scheduler-eval --target scheduler_eval_all -j 8
    - name: Test scheduler evaluations
      env:
        OMP_PROC_BIND: "false"
        KMP_AFFINITY: "disabled"
      run: >
        python3 benchmarks/scheduler_eval/tools/ctest_ci.py
        --test-dir build-scheduler-eval --output-on-failure -L scheduler-eval --timeout 120
    - name: Require external backend targets
      if: matrix.external-backends == 'ON'
      run: >
        cmake --build build-scheduler-eval --target
        bench_scheduler_eval_TBB_SIMPLE bench_scheduler_eval_RAPID_START
        bench_scheduler_eval_OMP_STATIC -j 8

  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: true

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest] #, windows-latest
        build_type: [Release, Debug]
        c_compiler: [gcc, clang-19, cl]
        include:
          # - os: windows-latest
          #   c_compiler: cl
          #   cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang-19
            cpp_compiler: clang++-19
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v5

    - name: Dependencies
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        sudo apt-get update
        sudo apt-get install -y make cmake clang-19 libbenchmark-dev libgtest-dev libgflags-dev libboost-all-dev libdouble-conversion-dev libfmt-dev libgoogle-glog-dev
    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DOOX_BUILD_BENCHMARKS=OFF
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} -j 8

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure
